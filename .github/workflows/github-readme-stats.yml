name: Generate GitHub Stats Card

on:
  schedule:
    - cron: '0 0 * * *'  
  workflow_dispatch:        

jobs:
  generate-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Generate stats card
        run: |
          curl "https://github-readme-stats.vercel.app/api?username=mohamed-hisham-swidan&show_icons=true&theme=radical&hide_border=true&bg_color=0D1117&title_color=FF6B35&icon_color=FF6B35&text_color=C9D1D9" -o stats.svg
          curl "https://github-readme-stats.vercel.app/api/pin/?username=mohamed-hisham-swidan&repo=HardWorkers&theme=radical&hide_border=true&bg_color=0D1117&title_color=FF6B35&icon_color=FF6B35" -o pin.svg

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add stats.svg pin.svg
          git diff --quiet && git diff --staged --quiet || git commit -m "Update stats cards"
          git push
